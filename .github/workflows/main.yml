name: Build Rust Releases

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (格式 v1.0.0)"
        required: true
        default: "v1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  metadata:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.set-build-time.outputs.build_time }}
    steps:
      - name: Set build time
        id: set-build-time
        shell: bash
        run: |
          echo "build_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact_name: iptest-linux-amd64
            binary_name: iptest
            build_command: cargo
          - target: aarch64-unknown-linux-gnu
            artifact_name: iptest-linux-arm64
            binary_name: iptest
            build_command: cargo
          - target: x86_64-pc-windows-msvc
            artifact_name: iptest-windows-amd64.exe
            binary_name: iptest.exe
            build_command: xwin
          - target: aarch64-pc-windows-msvc
            artifact_name: iptest-windows-arm64.exe
            binary_name: iptest.exe
            build_command: xwin
          - target: x86_64-apple-darwin
            artifact_name: iptest-darwin-amd64
            binary_name: iptest
            build_command: cargo
          - target: aarch64-apple-darwin
            artifact_name: iptest-darwin-arm64
            binary_name: iptest
            build_command: cargo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install shared build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            gcc-aarch64-linux-gnu \
            lld \
            llvm \
            pkg-config \
            unzip \
            zip

      - name: Install cargo-xwin
        if: contains(matrix.target, 'windows-msvc')
        shell: bash
        run: cargo install cargo-xwin --locked

      - name: Setup osxcross
        if: contains(matrix.target, 'apple-darwin')
        uses: mbround18/setup-osxcross@v1
        with:
          osx-version: "14.0"

      - name: Prepare release assets directory
        shell: bash
        run: mkdir -p "${GITHUB_WORKSPACE}/release_assets"

      - name: Configure target linker
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
              ;;
            x86_64-pc-windows-msvc)
              echo "CC=clang-cl" >> "$GITHUB_ENV"
              echo "CXX=clang-cl" >> "$GITHUB_ENV"
              echo "AR=llvm-lib" >> "$GITHUB_ENV"
              echo "CC_x86_64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
              echo "CXX_x86_64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
              echo "AR_x86_64_pc_windows_msvc=llvm-lib" >> "$GITHUB_ENV"
              echo "CC_X86_64_PC_WINDOWS_MSVC=clang-cl" >> "$GITHUB_ENV"
              echo "CXX_X86_64_PC_WINDOWS_MSVC=clang-cl" >> "$GITHUB_ENV"
              echo "AR_X86_64_PC_WINDOWS_MSVC=llvm-lib" >> "$GITHUB_ENV"
              ;;
            aarch64-pc-windows-msvc)
              echo "CC=clang-cl" >> "$GITHUB_ENV"
              echo "CXX=clang-cl" >> "$GITHUB_ENV"
              echo "AR=llvm-lib" >> "$GITHUB_ENV"
              echo "CC_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
              echo "CXX_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
              echo "AR_aarch64_pc_windows_msvc=llvm-lib" >> "$GITHUB_ENV"
              echo "CC_AARCH64_PC_WINDOWS_MSVC=clang-cl" >> "$GITHUB_ENV"
              echo "CXX_AARCH64_PC_WINDOWS_MSVC=clang-cl" >> "$GITHUB_ENV"
              echo "AR_AARCH64_PC_WINDOWS_MSVC=llvm-lib" >> "$GITHUB_ENV"
              echo "CC_ENABLE_DEBUG_OUTPUT=1" >> "$GITHUB_ENV"
              echo "RUST_BACKTRACE=full" >> "$GITHUB_ENV"
              ;;
            x86_64-apple-darwin)
              echo "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=o64-clang" >> "$GITHUB_ENV"
              echo "CC_x86_64_apple_darwin=o64-clang" >> "$GITHUB_ENV"
              echo "CXX_x86_64_apple_darwin=o64-clang++" >> "$GITHUB_ENV"
              ;;
            aarch64-apple-darwin)
              echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=oa64-clang" >> "$GITHUB_ENV"
              echo "CC_aarch64_apple_darwin=oa64-clang" >> "$GITHUB_ENV"
              echo "CXX_aarch64_apple_darwin=oa64-clang++" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build
        shell: bash
        run: |
          echo "Building ${{ matrix.artifact_name }} for ${{ matrix.target }}"

          if [ "${{ matrix.build_command }}" = "xwin" ]; then
            if [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
              cargo xwin build -vv --release --locked --target "${{ matrix.target }}"
            else
              cargo xwin build --release --locked --target "${{ matrix.target }}"
            fi
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package binary and checksum
        shell: bash
        run: |
          built_binary="${GITHUB_WORKSPACE}/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          asset_path="${GITHUB_WORKSPACE}/release_assets/${{ matrix.artifact_name }}"

          cp "$built_binary" "$asset_path"

          hash="$(sha256sum "$asset_path" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "${{ matrix.artifact_name }}" > "${asset_path}.sha256"

          ls -lh "${GITHUB_WORKSPACE}/release_assets"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ github.workspace }}/release_assets/*

  release:
    name: Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release_assets
          find artifacts -type f ! -name "*.txt" -exec mv {} release_assets/ \;
          echo "Files to release:"
          ls -lh release_assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## Rust 多平台构建版本
            **构建时间:** ${{ needs.metadata.outputs.build_time }}

            已包含以下平台产物：
            - Windows amd64
            - Windows arm64
            - Linux amd64
            - Linux arm64
            - macOS amd64
            - macOS arm64

            每个二进制文件均附带 `.sha256` 校验文件。
          files: |
            ${{ github.workspace }}/release_assets/*
          draft: false
          prerelease: ${{ contains(github.event.inputs.release_tag, '-rc') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
