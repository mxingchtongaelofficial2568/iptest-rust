[package]
name = "iptest"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iptest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.5"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
indicatif = "0.17"
maxminddb = "0.25"
mimalloc = "0.1"
owo-colors = "4.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "gzip", "brotli"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "time", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false
